# تنظیمات سیستم پژوهش و انتشار کانال Gamification Club
timezone: Asia/Tehran
channel_link: https://t.me/Gamification_club
channel_handle: "@Gamification_club"

# حداقل امتیاز (از ۱۰۰) برای انتشار. اگر خیلی کم پست می‌شود کمش کن، اگر ضعیف پست می‌شود بالا ببر.
min_score: 70
post_max_chars: 1000         # سقف طول پست (کپشن تلگرام برای عکس‌دار ۱۰۲۴ است)
post_min_chars: 250
source_text_limit: 9000     # حداکثر طول متن منبع که به مدل داده می‌شود
lookback_days: 150           # مقالات تا چند روز قبل بررسی شوند
max_candidates_to_score: 40  # تعداد مطلب برای امتیازدهی در هر اجرا
score_batch: 20              # تعداد مطلب در هر فراخوانی مدل
max_articles_to_write: 3     # حداکثر مقاله‌ای که برای نگارش امتحان می‌شود
writes_per_article: 2        # حداکثر دفعات بازنویسی بعد از رد شدن در کنترل کیفیت
use_source_images: true      # استفاده از عکس خود منبع (در صورت وجود) با ذکر لینک منبع
max_image_mb: 5

# وزن معیارها (مجموع ۱۰۰)
weights:
  relevance: 20
  credibility: 20
  depth_rarity: 20
  practical: 15
  shareability: 10
  difference: 10
  image: 5
# شرط‌های سخت: هر کدام رد شود مطلب منتشر نمی‌شود
gates:
  min_relevance: 7
  min_credibility: 6
  max_overlap_with_previous: 6

# ترتیب مدل‌های Gemini (اگر مدلی بازنشسته شد خودکار مدل بعدی/جدیدتر انتخاب می‌شود)
models:   # gemini-flash-latest در تست‌ها بارها 503/تایم‌اوت داد؛ نسخه‌ی lite سریع و پایدار بود
  - gemini-flash-lite-latest
  - gemini-flash-latest
  - gemini-3.5-flash
  - gemini-3.5-flash-lite

# عبارت‌های جست‌وجو در پایگاه‌های علمی
search_terms:
  - gamification
  - self-determination theory
  - intrinsic motivation rewards
  - loss aversion incentives
  - habit formation behavior change
  - nudge choice architecture
  - customer loyalty program
  - employee engagement motivation
  - behavioral economics decision making
  - consumer behavior experiment
  - goal setting feedback motivation
  - social comparison leaderboard
crossref_max_terms: 4
per_term_results: 8

# منابع تخصصی (RSS). اگر فیدی خراب باشد در گزارش ثبت و رد می‌شود.
rss_feeds:
  - {name: Behavioral Scientist, url: "https://behavioralscientist.org/feed/"}
  - {name: Nielsen Norman Group, url: "https://www.nngroup.com/feed/rss/"}
  - {name: Yu-kai Chou Octalysis, url: "https://yukaichou.com/feed/"}
  - {name: MIT Sloan Management Review, url: "https://sloanreview.mit.edu/feed/"}
  - {name: Duolingo Blog, url: "https://blog.duolingo.com/rss/"}

site:
  url: https://moarek.ir
  refresh_days: 7
  max_pages: 90
  seed_pages:   # صفحاتی که حتماً در فهرست دکمه‌ها هستند (بقیه از sitemap سایت خوانده می‌شود)
    - {url: "https://moarek.ir/gamification-training/", title: "آموزش گیمیفیکیشن", desc: "صفحه اصلی دوره و مسیر آموزش گیمیفیکیشن از صفر"}
    - {url: "https://moarek.ir/gamification-lessons/gamification-definition/", title: "درس اول: گیمیفیکیشن چیست؟", desc: "اولین درس آموزش گیمیفیکیشن، تعریف و مفاهیم پایه"}
    - {url: "https://moarek.ir/consulting/", title: "مشاوره گیمیفیکیشن", desc: "مشاوره طراحی سیستم گیمیفیکیشن برای کسب‌وکارها"}
    - {url: "https://moarek.ir/product-category/library/", title: "کتابخانه معارک", desc: "کتاب‌ها و محصولات آموزشی گیمیفیکیشن"}
    - {url: "https://moarek.ir/gamification-book/", title: "معرفی و مقایسه کتاب‌های گیمیفیکیشن", desc: "مرور ۸ کتاب گیمیفیکیشن و مسیر مطالعه"}
    - {url: "https://moarek.ir/gamification-marketing-mistakes/", title: "اشتباهات رایج گیمیفیکیشن در بازاریابی", desc: "چرا بیشتر کمپین‌های بازی‌وار بازاریابی خرید و وفاداری نمی‌سازند"}
    - {url: "https://moarek.ir/influence-on-the-minds-of-others/", title: "تأثیرگذاری بر ذهن دیگران", desc: "مقاله درباره روان‌شناسی تأثیرگذاری و ترغیب"}

linkedin:
