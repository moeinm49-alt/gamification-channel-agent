# تنظیمات سیستم پژوهش و انتشار کانال Gamification Club
timezone: Asia/Tehran
channel_link: https://t.me/Gamification_club
channel_handle: "@Gamification_club"
channel_emoji: "📣"

# املای نام‌ها: مدل باید دقیقاً همین‌ها را بنویسد؛ املای اشتباه رایج خودکار اصلاح می‌شود
glossary:
  - {en: "Yu-kai Chou", fa: "یوکای چو", wrong: ["یوکای چاو", "یوکای چائو", "یو کای چو", "یوکای چوو", "یوکای شو"]}
  - {en: "Octalysis", fa: "Octalysis", wrong: []}

# اسلات خبر و آپدیت (پست دوم روز)
news:
  lookback_days: 5            # فقط مطالب ۵ روز اخیر
  min_score: 72
  weights: {relevance: 25, credibility: 15, depth_rarity: 20, practical: 15, shareability: 10, difference: 10, image: 5}
  gates: {min_relevance: 7, min_credibility: 5, min_newsworthiness: 6, max_overlap_with_previous: 6}
  feeds:
    - {name: Marketing Dive, url: "https://www.marketingdive.com/feeds/news/"}
    - {name: Digiday, url: "https://digiday.com/feed/"}
    - {name: Retail Dive, url: "https://www.retaildive.com/feeds/news/"}
    - {name: Adweek, url: "https://www.adweek.com/feed/"}
    - {name: Fast Company, url: "https://www.fastcompany.com/latest/rss"}
    - {name: CustomerThink, url: "https://customerthink.com/feed/"}
    - {name: Game Developer, url: "https://www.gamedeveloper.com/rss.xml"}
    - {name: GamesIndustry.biz, url: "https://www.gamesindustry.biz/feed"}
    - {name: UX Collective, url: "https://uxdesign.cc/feed"}
    - {name: Lenny's Newsletter, url: "https://www.lennysnewsletter.com/feed"}
    - {name: Duolingo Blog, url: "https://blog.duolingo.com/feed/"}
    - {name: Nielsen Norman Group, url: "https://www.nngroup.com/feed/rss/"}
    - {name: MIT Sloan Management Review, url: "https://sloanreview.mit.edu/feed/"}

# تنوع منبع
repeat_source_penalty: 20   # جریمه‌ی هر بار تکرار همان منبع در ۳ پست آخر
switch_type_bonus: 6        # امتیاز اضافه برای عوض شدن نوع منبع (مقاله ↔ وبلاگ)

# حداقل امتیاز (از ۱۰۰) برای انتشار. اگر خیلی کم پست می‌شود کمش کن، اگر ضعیف پست می‌شود بالا ببر.
min_score: 70
post_max_chars: 1000         # سقف طول پست (کپشن تلگرام برای عکس‌دار ۱۰۲۴ است)
post_min_chars: 250
source_text_limit: 9000     # حداکثر طول متن منبع که به مدل داده می‌شود
lookback_days: 150           # مقالات تا چند روز قبل بررسی شوند
max_candidates_to_score: 40  # تعداد مطلب برای امتیازدهی در هر اجرا
score_batch: 20              # تعداد مطلب در هر فراخوانی مدل
max_articles_to_write: 3     # حداکثر مقاله‌ای که برای نگارش امتحان می‌شود
writes_per_article: 2        # حداکثر دفعات بازنویسی بعد از رد شدن در کنترل کیفیت
use_source_images: true      # استفاده از عکس خود منبع (در صورت وجود) با ذکر لینک منبع
max_image_mb: 5

# وزن معیارها (مجموع ۱۰۰)
weights:
  relevance: 20
  credibility: 20
  depth_rarity: 20
  practical: 15
  shareability: 10
  difference: 10
  image: 5
# شرط‌های سخت: هر کدام رد شود مطلب منتشر نمی‌شود
gates:
  min_relevance: 7
  min_credibility: 6
  max_overlap_with_previous: 6

# ترتیب مدل‌های Gemini (اگر مدلی بازنشسته شد خودکار مدل بعدی/جدیدتر انتخاب می‌شود)
models_fast:      # امتیازدهی: سریع و کم‌هزینه
  - gemini-flash-lite-latest
  - gemini-3.5-flash-lite
models_quality:   # نگارش، ویراستاری و بازبینی: مدل قوی‌تر (کیفیت فارسی مهم‌تر از سرعت است)
  - gemini-3.5-flash
  - gemini-flash-latest
models:   # فهرست کلی/جایگزین؛ # gemini-flash-latest در تست‌ها بارها 503/تایم‌اوت داد؛ نسخه‌ی lite سریع و پایدار بود
  - gemini-flash-lite-latest
  - gemini-flash-latest
  - gemini-3.5-flash
  - gemini-3.5-flash-lite

# عبارت‌های جست‌وجو در پایگاه‌های علمی
search_terms:
  - gamification
  - self-determination theory
  - intrinsic motivation rewards
  - loss aversion incentives
  - habit formation behavior change
  - nudge choice architecture
  - customer loyalty program
  - employee engagement motivation
  - behavioral economics decision making
  - consumer behavior experiment
  - goal setting feedback motivation
  - social comparison leaderboard
crossref_max_terms: 4
per_term_results: 8

# منابع تخصصی (RSS). اگر فیدی خراب باشد در گزارش ثبت و رد می‌شود.
rss_feeds:
  - {name: Nielsen Norman Group, url: "https://www.nngroup.com/feed/rss/"}
  - {name: Yu-kai Chou Octalysis, url: "https://yukaichou.com/feed/"}
  - {name: MIT Sloan Management Review, url: "https://sloanreview.mit.edu/feed/"}
  - {name: Duolingo Blog, url: "https://blog.duolingo.com/rss/"}

