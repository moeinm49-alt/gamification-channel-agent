# زمان‌بندی (ساعت انتشار را می‌شود با دستور /time در ربات عوض کرد)
schedule:
  post_time: "18:30"          # به وقت تهران؛ فقط :۰۰ یا :۳۰
  prepare_lead_min: 90        # پست از ۹۰ دقیقه قبل آماده می‌شود تا انتشار سر وقت باشد
  late_cutoff: "23:30"        # بعد از این ساعت پست روز منتشر نمی‌شود
  max_prepare_attempts: 5
  earliest: "07:00"
  latest: "23:00"

