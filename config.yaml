# جمله‌ی دعوت به کانال (بولد، با ایموجی)؛ به‌نوبت یکی از این‌ها
cta_variants:   # کل جمله لینک کانال است
  - "تحلیل‌های کاربردی گیمیفیکیشن و علوم رفتاری، هر روز در کانال Gamification Club"
  - "برای یافته‌های معتبر رفتار و انگیزش، به زبان ساده، کانال Gamification Club را دنبال کنید"
  - "پژوهش‌های روز گیمیفیکیشن و اقتصاد رفتاری، با نگاه کاربردی برای کسب‌وکار"
  - "مرجع تحلیل‌های رفتاری و گیمیفیکیشن برای مدیران و متخصصان، در Gamification Club"
  - "بینش‌های مبتنی بر پژوهش برای طراحی رفتار و انگیزش، در کانال Gamification Club"
  - "هر روز یک یافته‌ی معتبر و کاربردی از دنیای گیمیفیکیشن و علوم رفتاری"

# زمان‌بندی (ساعت انتشار را می‌شود با دستور /time در ربات عوض کرد)
schedule:
  slots:                      # دو پست در روز؛ ساعت‌ها به وقت تهران و فقط :۰۰ یا :۳۰ (با /time در ربات قابل تغییر)
    insight: {kind: insight, time: "12:00", label: "پست پژوهشی/تحلیلی"}
    news: {kind: news, time: "20:30", label: "خبر و آپدیت", enabled: false}   # غیرفعال (مصرف دقیقه‌ی گیت‌هاب)
  start_date: "2026-10-29"    # اولین روز انتشار خودکار
  prepare_lead_min: 120       # پست از ۲ ساعت قبل آماده می‌شود تا انتشار سر وقت باشد
  late_cutoff: "23:30"        # بعد از این ساعت پست روز منتشر نمی‌شود
  max_prepare_attempts: 5
  reserve_target: 3           # حداقل تعداد پیش‌نویس تأییدشده در ذخیره؛ بعد از هر انتشار موفق، اگر کمتر بود یکی ساخته می‌شود
  reserve_after_min: 90       # اگر ۹۰ دقیقه بعد از ساعت انتشار هنوز پستی تولید نشده، از پست ذخیره استفاده می‌شود
  earliest: "07:00"
  latest: "23:00"

linkedin:
