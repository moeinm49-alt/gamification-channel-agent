name: daily-post

on:
  workflow_dispatch:
    inputs:
      task:
        description: "tick (اجرای عادی زمان‌بندی) | run (آماده‌سازی و انتشار فوری) | dry (پیش‌نمایش در چت خصوصی) | discover | ping"
        default: "tick"
      slot:
        description: "اسلات برای run/dry: insight (پژوهشی) یا news (خبری)"
        default: "insight"
      force:
        description: "اجرای دوباره حتی اگر امروز پست منتشر شده (true/false)"
        default: "false"
  schedule:
    - cron: "35 8 * * *"   # فقط یک اجرای پشتیبان در روز (۱۲:۰۵ تهران)؛ ماشه‌ی اصلی cron-job.org است و دقیقه‌ی گیت‌هاب را مصرف نمی‌کنیم

concurrency:
  group: gamification-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run agent
        timeout-minutes: 26
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          TASK: ${{ github.event.inputs.task || 'tick' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          SLOT: ${{ github.event.inputs.slot || 'insight' }}
        run: |
          if [ "$FORCE" = "true" ]; then python main.py "$TASK" --slot "$SLOT" --force; else python main.py "$TASK" --slot "$SLOT"; fi
      - name: Save state
        if: always()
        run: |
          git config user.name "gamification-agent"
          git config user.email "agent@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || (git commit -m "state $(date -u +%F-%H%M)" && git pull --rebase -X theirs -q && git push -q)
